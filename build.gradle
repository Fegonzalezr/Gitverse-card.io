buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

task assemble {}

plugins {
  id "org.sonarqube" version "7.6.0.18749"
}

sonar {
  properties {
    property "sonar.projectKey", "Fegonzalezr_Gitverse-card.io"
    property "sonar.organization", "fegonzalezr"
  }
}

ext {
    sdkVersion = 36
    buildToolsVersion = '35.0.1'
    ndkVersion = '28.0.13004108'
}

repositories {
    google()
}
